name: Test and publish LINE MTC
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.3', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run test:server && npm test
      - run: npm run test:shared
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: even-hub-package
          path: line-mtc-*.ehpk
  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: line-mtc:smoke
      - name: Check container startup and authenticated API
        run: |
          docker run -d --name line-mtc-smoke -p 127.0.0.1:28110:3000 -e LINE_MTC_ADMIN_PASSWORD=ci-only-container-password -e PUBLIC_ORIGIN=http://127.0.0.1:28110 line-mtc:smoke
          trap 'docker rm -f line-mtc-smoke >/dev/null' EXIT
          curl --retry 10 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:28110/api/health
          node scripts/container-smoke.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/9vibes/line-mtc
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo '${{ steps.build.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
